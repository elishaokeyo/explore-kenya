<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXPLORE KENYA</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-green: #2e7d32;
      --accent-gold: #ffb300;
      --brand-red: #d32f2f;
      --glass-bg: rgba(20, 25, 20, 0.85);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #0f1410;
      color: #ffffff;
      min-height: 100vh;
    }

    /* --- Glassmorphic Animated Navbar Header --- */
    /* .custom-navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(46, 125, 50, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      padding: 12px 24px !important;
      transition: all 0.3s ease;
    } */

    /* Brand Logo Animation */
    .navbar-brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff !important;
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .navbar-brand:hover {
      transform: scale(1.05);
    }

    .brand-kenya {
      color: #4caf50;
      text-shadow: 0 0 10px rgba(76, 175, 80, 0.6);
      animation: pulseGlow 2.5s infinite alternate;
    }

    @keyframes pulseGlow {
      from { text-shadow: 0 0 5px rgba(76, 175, 80, 0.4); }
      to { text-shadow: 0 0 15px rgba(76, 175, 80, 0.9), 0 0 25px rgba(255, 179, 0, 0.4); }
    }

    /* Navigation Links */
    .navbar-nav .nav-link {
      color: #e0e0e0 !important;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: capitalize;
      padding: 8px 14px !important;
      margin: 0 2px;
      border-radius: 20px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .navbar-nav .nav-link:hover {
      color: #ffffff !important;
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .navbar-nav .nav-link::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--accent-gold);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .navbar-nav .nav-link:hover::after {
      width: 60%;
    }

    /* Search Bar Styling */
    .search-box {
      position: relative;
      max-width: 260px;
    }

    .search-input {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-radius: 25px !important;
      color: #ffffff !important;
      padding-left: 15px !important;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.2) !important;
      border-color: #4caf50 !important;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.4) !important;
    }

    .btn-search {
      border-radius: 25px !important;
      padding: 5px 18px !important;
      font-weight: 600;
      font-size: 0.85rem;
      border-color: #4caf50 !important;
      color: #4caf50 !important;
      transition: all 0.3s ease !important;
    }

    .btn-search:hover {
      background: #4caf50 !important;
      color: #ffffff !important;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
    }

    /* User Profile & Auth Badges */
    .user-badge {
      background: rgba(211, 47, 47, 0.2);
      border: 1px solid rgba(211, 47, 47, 0.5);
      color: #ff8a80;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    /* Special Spin Animation Button */
    .btn-spin-auth {
      background: linear-gradient(135deg, #2e7d32, #4caf50);
      color: #ffffff !important;
      font-weight: 700;
      border-radius: 25px;
      padding: 8px 20px !important;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-spin-auth:hover {
      animation: navSpin 0.6s ease-in-out forwards;
      background: linear-gradient(135deg, #f57c00, #ffb300);
      color: #000000 !important;
      box-shadow: 0 0 20px rgba(255, 179, 0, 0.6);
    }

    @keyframes navSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1.05); }
    }

    /* Toggler Icon Customization */
    .navbar-toggler {
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      border-radius: 10px;
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }
  </style>
</head>
<body>

  <!-- NAVIGATION BAR -->
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
    <div class="container-fluid">
      
      <!-- Brand Logo -->
      <a href="/index" class="navbar-brand">
        <i class="fa-solid fa-compass me-1 text-warning"></i>
        EXPLORE..<b class="brand-kenya">KENYA</b>
      </a>

      <!-- Mobile Menu Toggle Button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible Container -->
      <div class="collapse navbar-collapse" id="navbarCollapse">
        
        <!-- Center Nav Links -->
        <div class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-lg-center">
          <a href="/index" class="nav-item nav-link"><i class="fa-solid fa-house me-1"></i> Home</a>
          <a href="/culture" class="nav-item nav-link">Culture</a>
          <a href="/education" class="nav-item nav-link">Education</a>
          <a href="/entertainment" class="nav-item nav-link">Entertainment</a>
          <a href="/politics" class="nav-item nav-link">Politics</a>
          <a href="/tourism" class="nav-item nav-link">Tourism</a>
          <a href="/sports" class="nav-item nav-link">Sports</a>
          <a href="/religion" class="nav-item nav-link">Religion</a>
          <a href="/upload" class="nav-item nav-link"><i class="fa-solid fa-cloud-arrow-up me-1"></i> Upload</a>
        </div> 

        

        <!-- Right User Auth Actions -->
        <div class="navbar-nav align-items-lg-center gap-2 mt-2 mt-lg-0">
          {% if session['key'] %}
            <span class="user-badge">
              <i class="fa-solid fa-user-check me-1"></i> {{ session["key"] }}
            </span>
            <a href="/logout" class="btn btn-outline-danger btn-sm rounded-pill px-3">
              <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
            </a>
          {% else %}
            <a href="/login" class="nav-item nav-link px-3">Login</a>
            <a href="/register" class="nav-item nav-link btn-spin-auth">
              <i class="fa-solid fa-user-plus me-1"></i> Sign In
            </a>
          {% endif %}
        </div>

      </div>
    </div>
  </nav>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
